name: Result Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 30 minutes
    - cron: "30 1 * * *"     # 7:00 AM IST (UTC 1:30)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ✅ Run monitor (cron OR manual)
      - name: Run monitor
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TO_WHATSAPP: ${{ secrets.TO_WHATSAPP }}
        run: python monitor.py

      # ✅ Run heartbeat (cron OR manual)
      - name: Run heartbeat
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *'
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TO_WHATSAPP: ${{ secrets.TO_WHATSAPP }}
        run: python heartbeat.py

      # ✅ Safe commit (handles race conditions)
      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add state.json
          git commit -m "update state" || echo "no changes"

          git pull --rebase origin main || echo "rebase failed"

          git push || echo "push skipped"
